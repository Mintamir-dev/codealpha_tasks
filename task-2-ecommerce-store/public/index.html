<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><title>Buna Market - Ethiopian coffee, spices and crafts</title></head>
<body>
<div class="stripe"></div>
<header class="site"><div class="bar">
  <a class="logo" href="index.html">Buna Market</a>
  <nav><a href="index.html">Shop</a>
  <a class="cart-link" href="cart.html">Cart<span class="count" id="cart-count">0</span></a></nav>
</div></header>
<main>
  <section class="hero">
    <h1>Ethiopian coffee, spices and crafts</h1>
    <p>Fresh from the highlands to your door. Pick what you like and pay when it arrives.</p>
  </section>
  <div class="tools">
    <input id="search" type="search" placeholder="Search products" aria-label="Search products">
    <select id="category" aria-label="Filter by category">
      <option value="">All categories</option>
      <option>Coffee</option><option>Food</option><option>Homeware</option><option>Clothing</option>
    </select>
  </div>
  <div class="grid" id="products"></div>
</main>
<footer>Buna Market · CodeAlpha internship project</footer>
<script src="js/app.js"></script>
<script src="js/index.js"></script>
</body></html>
